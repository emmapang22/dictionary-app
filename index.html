<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dictionary-app</title>
    <link href="/src/tailwind.css" rel="stylesheet" />
  </head>
  <body class="flex flex-col justify-center items-center mt-7">
    <form id="searchForm">
      <label for="searchText">Write your word here:</label>

      <input
        type="text"
        name="searchText"
        id="searchText"
        placeholder="Search a word"
        class="bg-white rounded text-black py-1 px-2"
      />

      <button
        type="submit"
        class="bg-blue-200 py-1 px-2 rounded text-black hover:cursor-pointer hover:bg-blue-400"
      >
        Search
      </button>
    </form>

    <section id="wordSection"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
